<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로또 번호 수정기</title>
<style>
:root[data-theme="dark"]{--bg:#130307;--c:#fff;--cb:rgba(28,6,12,.9);--bd:rgba(220,20,60,.2);--gb:rgba(139,0,0,.08);--lc:#e8907a;--ic:#c9897a;--ib:rgba(220,20,60,.08);--er:#ff7070}
:root[data-theme="light"]{--bg:#fff0ea;--c:#2d0a0a;--cb:rgba(255,250,248,.96);--bd:rgba(180,20,40,.2);--gb:rgba(255,235,230,.6);--lc:#b83040;--ic:#a03040;--ib:rgba(220,20,60,.07);--er:#c00020}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;transition:.2s}
body{min-height:100vh;display:flex;justify-content:center;padding:40px 20px;background:var(--bg)}
.card{width:560px;background:var(--cb);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:0 0 40px rgba(139,0,0,.3)}
h1{color:var(--c);font-size:24px;margin-bottom:4px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.desc{color:var(--ic);font-size:13px;margin-bottom:20px}
.btn-row{display:flex;gap:8px;margin-bottom:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;color:#fff;transition:.2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.bm{background:linear-gradient(90deg,#8b0000,#dc143c,#ff6b35)}
.ba{background:var(--ib);border:1px solid var(--bd);color:var(--c)}
.game{background:var(--gb);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gl{color:var(--lc);font-size:13px;font-weight:600}
.ib{background:var(--ib);border:1px solid var(--bd);border-radius:6px;color:var(--ic);font-size:12px;padding:3px 8px;cursor:pointer}
.ib:hover{opacity:.7}
.balls{display:flex;gap:7px;flex-wrap:wrap}
.bw{display:flex;flex-direction:column;align-items:center;gap:5px}
.ball{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;user-select:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ball:hover{transform:scale(1.1)}
.ball.e{box-shadow:0 0 0 3px #ff6b35;transform:scale(1.1)}
input.bi{width:50px;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:6px;color:var(--c);font-size:13px;padding:3px 0;outline:none}
.em{color:var(--er);font-size:12px;min-height:14px;margin-top:6px}
.c1{background:linear-gradient(135deg,#ff8c00,#ff6b35)}
.c2{background:linear-gradient(135deg,#dc143c,#c01230)}
.c3{background:linear-gradient(135deg,#800020,#6b001a)}
.c4{background:linear-gradient(135deg,#b85c38,#8c3a20)}
.c5{background:linear-gradient(135deg,#a0001e,#7a0018)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:linear-gradient(90deg,#8b0000,#dc143c);color:#fff;padding:9px 20px;border-radius:30px;font-size:13px;font-weight:bold;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <h1>✏️ 로또 번호 수정기</h1>
    <button class="ib" id="themeBtn" onclick="toggleTheme()">🌙 다크</button>
  </div>
  <p class="desc">번호 클릭 → 수정 (1~45, 중복 불가)</p>
  <div class="btn-row">
    <button class="btn bm" onclick="addGame(1)">🎲 랜덤 추가</button>
    <button class="btn ba" onclick="addGame(0)">➕ 빈 게임 추가</button>
  </div>
  <div id="gl"></div>
</div>
<div id="toast"></div>
<script>
let games=[],gc=0;
const H=document.documentElement,TB=document.getElementById('themeBtn');
function setTheme(t){H.setAttribute('data-theme',t);localStorage.setItem('theme',t);TB.textContent=t==='dark'?'☀️ 라이트':'🌙 다크'}
function toggleTheme(){setTheme(H.getAttribute('data-theme')==='dark'?'light':'dark')}
setTheme(localStorage.getItem('theme')||'dark');
function gc_(n){return n<=10?'c1':n<=20?'c2':n<=30?'c3':n<=40?'c4':'c5'}
function rnd(){let a=[];while(a.length<6){let n=Math.floor(Math.random()*45)+1;if(!a.includes(n))a.push(n);}return a.sort((a,b)=>a-b)}
function addGame(r){gc++;let id=gc,nums=r?rnd():[0,0,0,0,0,0];games.push({id,nums});renderGame(id)}
function bHTML(gid,i,n){let c=n>=1&&n<=45?gc_(n):'c4',l=n>0?n:'?';
  return`<div class="bw" id="w-${gid}-${i}"><div class="ball ${c}" id="b-${gid}-${i}" onclick="edit(${gid},${i})">${l}</div></div>`}
function renderGame(id){
  let g=games.find(x=>x.id===id),ol=document.getElementById('g-'+id);
  if(ol)ol.remove();
  let d=document.createElement('div');d.className='game';d.id='g-'+id;
  d.innerHTML=`<div class="gh"><span class="gl">게임 ${id}</span><span>
    <button class="ib" onclick="refreshGame(${id})">🔀</button>
    <button class="ib" onclick="sortGame(${id})">↑정렬</button>
    <button class="ib" onclick="copyGame(${id})">📋</button>
    <button class="ib" onclick="delGame(${id})">🗑</button>
  </span></div><div class="balls" id="balls-${id}">${g.nums.map((n,i)=>bHTML(id,i,n)).join('')}</div><div class="em" id="e-${id}"></div>`;
  document.getElementById('gl').appendChild(d);
}
function edit(gid,idx){
  let g=games.find(x=>x.id===gid),bl=document.getElementById(`b-${gid}-${idx}`),w=document.getElementById(`w-${gid}-${idx}`);
  if(w.querySelector('input'))return;
  bl.classList.add('e');
  let inp=document.createElement('input');inp.type='number';inp.className='bi';inp.min=1;inp.max=45;
  inp.value=g.nums[idx]>0?g.nums[idx]:'';inp.placeholder='1-45';
  w.appendChild(inp);inp.focus();inp.select();
  function commit(){
    let v=parseInt(inp.value),err=document.getElementById('e-'+gid);
    if(!v||v<1||v>45){err.textContent='1~45 사이 숫자를 입력하세요.';inp.remove();bl.classList.remove('e');return}
    if(g.nums.some((n,i)=>n===v&&i!==idx)){err.textContent=`${v}은(는) 중복입니다.`;inp.remove();bl.classList.remove('e');return}
    err.textContent='';g.nums[idx]=v;inp.remove();bl.classList.remove('e');bl.className=`ball ${gc_(v)}`;bl.textContent=v;
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){inp.remove();bl.classList.remove('e');}});
  inp.addEventListener('blur',commit);
}
function refreshGame(id){let g=games.find(x=>x.id===id);g.nums=rnd();document.getElementById('balls-'+id).innerHTML=g.nums.map((n,i)=>bHTML(id,i,n)).join('');document.getElementById('e-'+id).textContent=''}
function sortGame(id){let g=games.find(x=>x.id===id);g.nums.sort((a,b)=>a-b);document.getElementById('balls-'+id).innerHTML=g.nums.map((n,i)=>bHTML(id,i,n)).join('')}
function delGame(id){games=games.filter(x=>x.id!==id);document.getElementById('g-'+id)?.remove()}
function copyGame(id){let t=games.find(x=>x.id===id).nums.join(', ');navigator.clipboard.writeText(t).then(()=>{let el=document.getElementById('toast');el.textContent='복사: '+t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2000)})}
addGame(1);
</script>
</body>
</html>

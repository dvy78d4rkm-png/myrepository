<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 수정기</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    background:
        radial-gradient(circle at 15% 20%, #8b000055, transparent 35%),
        radial-gradient(circle at 80% 25%, #dc143c44, transparent 35%),
        radial-gradient(circle at 50% 85%, #ff6b3533, transparent 35%),
        #130307;
}

.card {
    width: 560px;
    background: rgba(28, 6, 12, .88);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(220, 20, 60, .18);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 50px rgba(139, 0, 0, .35), 0 0 0 1px rgba(255,107,53,.06);
}

h1 {
    color: white;
    font-size: 26px;
    margin-bottom: 6px;
}

.desc {
    color: #c9897a;
    font-size: 14px;
    margin-bottom: 24px;
}

.btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
}

.btn {
    flex: 1;
    border: none;
    padding: 14px;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
}

.btn-main {
    background: linear-gradient(90deg, #8b0000, #dc143c, #ff6b35);
}

.btn-add {
    background: rgba(220, 20, 60, .1);
    border: 1px solid rgba(220, 20, 60, .25);
}

.btn:hover {
    transform: translateY(-2px);
    opacity: .9;
}

/* 게임 목록 */
.game-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.game-item {
    background: rgba(139, 0, 0, .08);
    border: 1px solid rgba(220, 20, 60, .15);
    border-radius: 14px;
    padding: 18px 18px 14px;
    position: relative;
    animation: fadeIn .3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.game-label {
    color: #e8907a;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
}

.game-actions {
    display: flex;
    gap: 6px;
}

.icon-btn {
    background: rgba(220, 20, 60, .08);
    border: 1px solid rgba(220, 20, 60, .15);
    border-radius: 7px;
    color: #c9897a;
    font-size: 13px;
    padding: 4px 9px;
    cursor: pointer;
    transition: .2s;
}

.icon-btn:hover {
    background: rgba(220, 20, 60, .22);
    color: #ffcfc5;
}

.icon-btn.del:hover {
    background: rgba(139, 0, 0, .35);
    color: #ff6b6b;
}

/* 공 */
.balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.ball-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.ball {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
    user-select: none;
    position: relative;
}

.ball:hover {
    transform: scale(1.1);
    box-shadow: 0 0 16px rgba(255, 107, 53, .5);
}

.ball.editing {
    box-shadow: 0 0 0 3px #ff6b35;
    transform: scale(1.12);
}

.ball-input {
    width: 52px;
    text-align: center;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px;
    color: white;
    font-size: 14px;
    padding: 3px 0;
    outline: none;
}

/* 에러 메시지 */
.error-msg {
    color: #e74c3c;
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
}

/* 공 색상 — 주황/버건디/크림슨 계열 */
.yellow { background: linear-gradient(135deg, #ff8c00, #ff6b35); }
.blue   { background: linear-gradient(135deg, #dc143c, #c01230); }
.red    { background: linear-gradient(135deg, #800020, #6b001a); }
.gray   { background: linear-gradient(135deg, #b85c38, #8c3a20); }
.green  { background: linear-gradient(135deg, #a0001e, #7a0018); }

/* 복사 토스트 */
#toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(90deg, #8b0000, #dc143c);
    color: white;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    transition: .3s;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(220, 20, 60, .4);
}

#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="card">
    <h1>✏️ 로또 번호 수정기</h1>
    <p class="desc">번호를 클릭하면 직접 수정할 수 있습니다. 범위: 1~45, 중복 불가</p>

    <div class="btn-row">
        <button class="btn btn-main" onclick="addGame(true)">🎲 랜덤 게임 추가</button>
        <button class="btn btn-add"  onclick="addGame(false)">➕ 빈 게임 추가</button>
    </div>

    <div class="game-list" id="gameList"></div>
</div>

<div id="toast">복사 완료!</div>

<script>
let games = [];
let gameCount = 0;

function getColor(n) {
    if (n <= 10) return 'yellow';
    if (n <= 20) return 'blue';
    if (n <= 30) return 'red';
    if (n <= 40) return 'gray';
    return 'green';
}

function randomNums() {
    const nums = [];
    while (nums.length < 6) {
        const n = Math.floor(Math.random() * 45) + 1;
        if (!nums.includes(n)) nums.push(n);
    }
    return nums.sort((a, b) => a - b);
}

function addGame(isRandom) {
    gameCount++;
    const id = gameCount;
    const nums = isRandom ? randomNums() : [0, 0, 0, 0, 0, 0];
    games.push({ id, nums });
    renderGame(id);
}

function renderGame(id) {
    const game = games.find(g => g.id === id);
    const list = document.getElementById('gameList');

    // 기존 항목 제거 후 재생성
    const old = document.getElementById('game-' + id);
    if (old) old.remove();

    const item = document.createElement('div');
    item.className = 'game-item';
    item.id = 'game-' + id;

    item.innerHTML = `
        <div class="game-header">
            <span class="game-label">게임 ${id}</span>
            <div class="game-actions">
                <button class="icon-btn" onclick="refreshGame(${id})">🔀 랜덤</button>
                <button class="icon-btn" onclick="sortGame(${id})">↑ 정렬</button>
                <button class="icon-btn" onclick="copyGame(${id})">📋 복사</button>
                <button class="icon-btn del" onclick="deleteGame(${id})">🗑 삭제</button>
            </div>
        </div>
        <div class="balls" id="balls-${id}">
            ${game.nums.map((n, i) => ballHTML(id, i, n)).join('')}
        </div>
        <div class="error-msg" id="err-${id}"></div>
    `;

    list.appendChild(item);
}

function ballHTML(gameId, idx, num) {
    const color = num >= 1 && num <= 45 ? getColor(num) : 'gray';
    const label = num > 0 ? num : '?';
    return `
        <div class="ball-wrap" id="wrap-${gameId}-${idx}">
            <div class="ball ${color}" id="ball-${gameId}-${idx}"
                 onclick="startEdit(${gameId}, ${idx})">${label}</div>
        </div>
    `;
}

function startEdit(gameId, idx) {
    const game = games.find(g => g.id === gameId);
    const ballEl = document.getElementById(`ball-${gameId}-${idx}`);
    const wrap = document.getElementById(`wrap-${gameId}-${idx}`);

    if (wrap.querySelector('input')) return; // 이미 편집 중

    ballEl.classList.add('editing');

    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'ball-input';
    input.min = 1;
    input.max = 45;
    input.value = game.nums[idx] > 0 ? game.nums[idx] : '';
    input.placeholder = '1-45';
    wrap.appendChild(input);
    input.focus();
    input.select();

    function commit() {
        const val = parseInt(input.value);
        const errEl = document.getElementById('err-' + gameId);

        if (!val || val < 1 || val > 45) {
            errEl.textContent = '1~45 사이의 숫자를 입력하세요.';
            input.remove();
            ballEl.classList.remove('editing');
            return;
        }

        const dup = game.nums.some((n, i) => n === val && i !== idx);
        if (dup) {
            errEl.textContent = `${val}은(는) 이미 있는 번호입니다.`;
            input.remove();
            ballEl.classList.remove('editing');
            return;
        }

        errEl.textContent = '';
        game.nums[idx] = val;
        input.remove();
        ballEl.classList.remove('editing');
        ballEl.className = `ball ${getColor(val)}`;
        ballEl.textContent = val;
    }

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') {
            input.remove();
            ballEl.classList.remove('editing');
        }
    });
    input.addEventListener('blur', commit);
}

function refreshGame(id) {
    const game = games.find(g => g.id === id);
    game.nums = randomNums();
    const ballsEl = document.getElementById('balls-' + id);
    ballsEl.innerHTML = game.nums.map((n, i) => ballHTML(id, i, n)).join('');
    document.getElementById('err-' + id).textContent = '';
}

function sortGame(id) {
    const game = games.find(g => g.id === id);
    game.nums.sort((a, b) => a - b);
    const ballsEl = document.getElementById('balls-' + id);
    ballsEl.innerHTML = game.nums.map((n, i) => ballHTML(id, i, n)).join('');
}

function deleteGame(id) {
    games = games.filter(g => g.id !== id);
    const el = document.getElementById('game-' + id);
    if (el) el.remove();
}

function copyGame(id) {
    const game = games.find(g => g.id === id);
    const text = game.nums.join(', ');
    navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = `복사 완료: ${text}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

// 시작 시 랜덤 게임 1개 추가
addGame(true);
</script>
</body>
</html>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#060d1f;color:#fff;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;
  background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:99;backdrop-filter:blur(10px)}
.logo{font-size:20px;font-weight:800;text-decoration:none;color:#fff}
.logo span{color:#3b9eff}
.nav-links a{color:rgba(255,255,255,.65);text-decoration:none;font-size:14px;margin-left:24px;transition:.2s}
.nav-links a:hover{color:#fff}
.hero{padding:56px 20px 40px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(59,158,255,.14),transparent 60%)}
.hero h1{font-size:clamp(22px,4vw,36px);font-weight:800;margin-bottom:10px}
.hero p{color:rgba(255,255,255,.5);font-size:14px}
.wrap{max-width:520px;margin:48px auto 80px;padding:0 20px}
.form-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:32px}
label{display:block;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
input,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:#fff;font-size:14px;padding:11px 14px;outline:none;transition:.2s;margin-bottom:18px}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.25)}
input:focus,textarea:focus{border-color:#3b9eff;background:rgba(59,158,255,.06)}
textarea{resize:vertical;min-height:120px;font-family:inherit}
.btn{width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;font-size:15px;
  font-weight:700;color:#fff;background:linear-gradient(90deg,#1a6fd4,#3b9eff);transition:.2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.ok{text-align:center;color:#3b9eff;font-size:13px;margin-top:16px;display:none}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
footer{border-top:1px solid rgba(255,255,255,.07);padding:28px 40px;text-align:center}
.footer-links a{color:rgba(255,255,255,.45);text-decoration:none;font-size:13px;margin:0 10px;transition:.2s}
.footer-links a:hover{color:#3b9eff}
.footer-copy{color:rgba(255,255,255,.25);font-size:12px;margin-top:10px}

/* Disqus */

<div class="hero">

  <p>광고·파트너십·협업 관련 문의를 남겨주세요. 영업일 기준 1~3일 내로 답변드립니다.</p>
</div>

<div class="wrap">
  <div class="form-card">
    <form action="https://formspree.io/f/xbdvrkqk" method="POST" onsubmit="onSubmit(event)">
      <div class="info-row">
        <div>
          <label>이름 *</label>
          <input type="text" name="name" placeholder="홍길동" required>
        </div>
        <div>
          <label>이메일 *</label>
          <input type="email" name="email" placeholder="example@email.com" required>
        </div>
      </div>
      <label>회사 / 채널명</label>
      <input type="text" name="company" placeholder="선택 입력">
      <label>문의 내용 *</label>
      <textarea name="message" placeholder="제휴 목적, 규모, 원하시는 내용 등을 자유롭게 적어주세요." required></textarea>
      <input type="hidden" name="_subject" value="[제휴문의] SkyFind 새 문의">
      <input type="hidden" name="_language" value="ko">
      <button class="btn" type="submit">문의 보내기 →</button>
    </form>
    <p class="ok" id="ok">✅ 문의가 전송되었습니다. 감사합니다!</p>
  </div>
</div>

<script>
function onSubmit(e){
  e.preventDefault();
  const form=e.target;
  fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}})
    .then(r=>{
      if(r.ok){form.reset();document.getElementById('ok').style.display='block'}
      else alert('전송 오류. 다시 시도해주세요.')
    }).catch(()=>alert('네트워크 오류가 발생했습니다.'))
}
</script>
